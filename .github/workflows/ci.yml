name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, Fuzz & Security Tests on Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x]
        exclude:
          - os: macos-latest
            node-version: 20.x

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies (strict lockfile)
        run: npm ci

      - name: Run Catalog Diff & Unit Test Suite
        run: |
          npm run catalog:diff
          npm test

  typecheck-and-consumer:
    name: Strict TypeScript & External Consumer Tarball Verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies (strict lockfile)
        run: npm ci

      - name: Check release version & doc sync
        run: npm run check:release

      - name: Enforce >= 95% line coverage threshold
        run: node --test --experimental-test-coverage --test-coverage-lines=95

      - name: Strict TypeScript check (src/index.d.ts & src/react/index.d.ts)
        run: |
          npm run typecheck
          npx tsc --noEmit --strict --lib es2022,dom --target es2022 src/react/index.d.ts

      - name: Check per-component gzipped size budgets
        run: npm run check:size

      - name: Run exhaustive formal invariant verifier (6,147 states/topologies)
        run: npm run verify:formal

      - name: Audit API surface consistency across all 113 components
        run: npm run audit:api

      - name: External consumer tarball install & import test
        run: npm run verify:consumer

      - name: Upload Quality Matrix artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-matrix
          path: QUALITY.md

  verify-react:
    name: Real React (${{ matrix.react-version }}.x) StrictMode & TSX Consumer Test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        react-version: ['18', '19']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies (strict lockfile)
        run: npm ci

      - name: Verify @wcomp/elementum/react against real React ${{ matrix.react-version }}
        run: node tools/verify-react.js --react=${{ matrix.react-version }}

  verify-starters:
    name: Build Starter (${{ matrix.starter }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        starter:
          - react-19
          - vue-3
          - svelte-5
          - framework-comparison/react
          - framework-comparison/vue
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies (strict lockfile)
        run: npm ci

      - name: Verify starter "${{ matrix.starter }}" installs & builds cleanly
        run: node tools/verify-starters.js --starter=${{ matrix.starter }}

  browser-e2e:
    name: Real Browser & axe-core E2E (Chromium, Firefox, WebKit)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies (strict lockfile)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright + axe-core E2E suite
        run: npm run test:e2e

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-report
          path: playwright-report/
