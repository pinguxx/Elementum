name: Publish to npm & MCP Registry
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: NPM
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --provenance --access public

  publish-mcp:
    needs: publish
    if: always() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar -xz mcp-publisher
          chmod +x ./mcp-publisher
      - name: Validate server.json
        run: ./mcp-publisher validate
      - name: Login to Official MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish to Official MCP Registry
        run: ./mcp-publisher publish